server:
  port: 4550
  shutdown: "graceful"

management:
  endpoint:
    health:
      show-details: "always"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus
  tracing:
    enabled: true
    sampling:
      probability: 1.0

springdoc:
  packagesToScan: uk.gov.hmcts.cp.controllers
  writer-with-order-by-keys: true

spring:
  config:
    import: "optional:configtree:/mnt/secrets/rpe/"
  application:
    name: service-cp-crime-scheduleandlist-courtschedule
  web:
    resources:
      add-mappings: false     # disable serving any static resources and 404 message

case-mapper-client:
  url: ${AMP_BACKEND_URL:http://localhost:8081}
  path: /urnmapper

court-schedule-client:
  url: ${CP_BACKEND_URL:http://localhost:8081}
  path: /listing-query-api/query/api/rest/listing/hearings/allocated-and-unallocated
  cjscppuid: ${CJSCPPUID:00000000-0000-0000-0000-000000000000}

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}

auth:
  # OFF | OBSERVE | ENFORCE. OFF and OBSERVE take the client id from an UNVERIFIED token. Trusted
  # as injected per environment by the deployment (Kubernetes) - not second-guessed against which
  # environment this is.
  mode: ${AUTH_MODE:ENFORCE}
  # Injected per environment — no defaults on purpose.
  #
  # These identify the tenant that ISSUES the tokens and this API's registration inside that tenant.
  # Where the service is hosted in a different Azure tenant from the one issuing tokens, these are
  # the ISSUING tenant's values; the hosting tenant's directory id is the wrong answer.
  #
  # Leaving them blank makes EntraAuthProperties fail startup when mode is ENFORCE or OBSERVE. That
  # is deliberate: a default would let a deployment that forgot to inject come up healthy on another
  # environment's tenant and reject every token with INVALID_CLAIMS — a silent misconfiguration
  # rather than a loud one. Run locally with AUTH_MODE=OFF, which skips the check.
  #
  # v2.0 tokens carry the bare client-ID GUID, not api://<...>. It must be this API's own
  # registration: a token minted for a sibling CP API is correctly rejected on audience.
  tenant-id: ${AUTH_TENANT_ID:}
  audience: ${AUTH_AUDIENCE:}
  # Derived from tenant-id when blank.
  issuer: ${AUTH_ISSUER:}
  jwks-uri: ${AUTH_JWKS_URI:}
  clock-skew-seconds: ${AUTH_CLOCK_SKEW_SECONDS:60}
  jwks-cache-ttl-seconds: ${AUTH_JWKS_CACHE_TTL_SECONDS:600}