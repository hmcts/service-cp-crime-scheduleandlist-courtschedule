services:
  wiremock:
    image: wiremock/wiremock:3.6.0
    ports:
      - "8080:8080"
    volumes:
      - ./src/apiTest/resources/mappings:/home/wiremock/mappings
      - ./src/apiTest/resources/__files:/home/wiremock/__files
    command:
      - "--global-response-templating"
      - "--verbose"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CP_BACKEND_URL: "http://wiremock:8080"
      # apiTest only exercises actuator endpoints, which are exempt from validation anyway - no
      # real Entra tenant is available in this local docker-compose stack.
      AUTH_MODE: "OFF"
    ports:
      - "4550:4550"